# conf-kit на VPS: Caddy (HTTPS) → PocketBase (сайт и API) и MCP; Gotenberg (PDF) — без выхода в сеть.
#   cp deploy/.env.example deploy/.env   # заполнить
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Подробно — deploy/README.md.
name: conf-kit

services:
  pocketbase:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ${CONF_ENV_FILE:-.env}
    environment:
      CONF_GOTENBERG_URL: http://gotenberg:3000
      CONF_TRUSTED_PROXY_HEADER: X-Forwarded-For
    volumes:
      - pb_data:/app/pb/pb_data
    networks: [web, pdf]
    depends_on: [gotenberg]

  mcp:
    build: { context: .., dockerfile: deploy/Dockerfile.mcp }
    restart: unless-stopped
    environment:
      CONF_API_URL: http://pocketbase:8090
    networks: [web]
    depends_on: [pocketbase]

  # Chromium без сети и без JavaScript: открывает только присланный index.html (deploy/README.md, «PDF»)
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript
      - --chromium-deny-list=^(?!file:///tmp/).*
      - --chromium-deny-private-ips
      - --chromium-deny-public-ips
      - --chromium-max-queue-size=10
      - --api-timeout=90s
      - --api-body-limit=8MB
      - --api-disable-download-from
      - --webhook-disable
      - --libreoffice-disable-routes
      - --prometheus-disable-collect
      - --log-level=warn
    networks: [pdf]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CONF_DOMAIN: ${CONF_DOMAIN:?CONF_DOMAIN в deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on: [pocketbase, mcp]

networks:
  web: {}
  # internal: у контейнеров этой сети нет выхода наружу
  pdf: { internal: true }

volumes:
  pb_data: {}
  caddy_data: {}
  caddy_config: {}
