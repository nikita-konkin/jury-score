# Локальная проверка без домена и HTTPS: Caddy на http://127.0.0.1:${CONF_LOCAL_PORT}, в .env — CONF_DOMAIN=:80.
# Использует tests/deploy/smoke.py:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.local.yml --env-file <файл> up -d --build
services:
  caddy:
    ports: !override
      - "127.0.0.1:${CONF_LOCAL_PORT:-8080}:80"
